<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ILOVEYOU Langga</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@600&display=swap">
<style>
/* Layout: full-screen night sky of rising hearts, one big pulsing title centered over it. Single romantic look by choice. */
:root {
  --bg-top: #2a0a1f;
  --bg-bottom: #5c1038;
  --glow: #ff3d7f;
  --title: #fff1f5;
  --soft: #ffb3c9;
  --font-display: "Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --font-body: "Nunito", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
  color: var(--title);
  font-family: var(--font-body);
  overflow: hidden;
}
canvas#sky {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
main {
  position: relative;
  z-index: 1;
  height: 100%;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.6rem;
  text-align: center;
  padding-block: 1rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  line-height: 1;
  letter-spacing: 0.02em;
  text-wrap: balance;
  color: var(--title);
  text-shadow: 0 0 18px var(--glow), 0 0 48px var(--glow), 0 4px 0 #b3124f;
  animation: beat 1.4s ease-in-out infinite;
}
h1 .line1 { display: block; font-size: clamp(2.6rem, 15vw, 8rem); }
h1 .line2 { display: block; font-size: clamp(3.2rem, 19vw, 10rem); color: var(--soft); }
.row {
  font-size: clamp(1.6rem, 7vw, 3rem);
  letter-spacing: 0.35em;
  padding-left: 0.35em;
  animation: beat 1.4s ease-in-out infinite;
  animation-delay: 0.15s;
}
.hint {
  margin: 0.8rem 0 0;
  font-size: 0.95rem;
  color: var(--soft);
  opacity: 0.85;
}
@keyframes beat {
  0%, 100% { transform: scale(1); }
  14% { transform: scale(1.06); }
  28% { transform: scale(1); }
  42% { transform: scale(1.04); }
  70% { transform: scale(1); }
}
@media (prefers-reduced-motion: reduce) {
  h1, .row { animation: none; }
}
</style>

<canvas id="sky" aria-hidden="true"></canvas>
<main>
  <div class="row" aria-hidden="true">💖💗💕</div>
  <h1>
    <span class="line1">ILOVEYOU</span>
    <span class="line2">LANGGA</span>
  </h1>
  <div class="row" aria-hidden="true">💕💗💖</div>
  <p class="hint">Tap anywhere for more hearts</p>
</main>

<script>
(function () {
  var canvas = document.getElementById("sky");
  var ctx = canvas.getContext("2d");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0;
  var colors = ["#ff3d7f", "#ff6f9f", "#ff94b8", "#ffc2d6", "#e8195f", "#ffffff"];
  var emojis = ["❤️", "💖", "💗", "💕", "💘", "💝"];
  var hearts = [];

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function rand(a, b) { return a + Math.random() * (b - a); }

  function makeHeart(x, y, burst) {
    var size = rand(14, 44);
    var h = {
      x: x !== undefined ? x : rand(0, W),
      y: y !== undefined ? y : H + size + rand(0, H * 0.4),
      size: size,
      speed: rand(0.5, 1.8) * (30 / Math.max(size, 14) + 0.6),
      sway: rand(10, 40),
      phase: rand(0, Math.PI * 2),
      freq: rand(0.6, 1.6),
      rot: rand(-0.4, 0.4),
      rotSpeed: rand(-0.004, 0.004),
      alpha: rand(0.45, 0.95),
      color: colors[Math.floor(Math.random() * colors.length)],
      emoji: Math.random() < 0.3 ? emojis[Math.floor(Math.random() * emojis.length)] : null,
      vx: 0,
      vy: 0
    };
    if (burst) {
      var a = rand(0, Math.PI * 2), s = rand(1.5, 5);
      h.vx = Math.cos(a) * s;
      h.vy = Math.sin(a) * s - 1.5;
      h.size = rand(14, 30);
      h.burst = true;
    }
    return h;
  }

  function heartPath(size) {
    var s = size / 2;
    ctx.beginPath();
    ctx.moveTo(0, s * 0.9);
    ctx.bezierCurveTo(-s * 1.6, -s * 0.2, -s * 0.9, -s * 1.3, 0, -s * 0.5);
    ctx.bezierCurveTo(s * 0.9, -s * 1.3, s * 1.6, -s * 0.2, 0, s * 0.9);
    ctx.closePath();
  }

  function draw(h) {
    ctx.save();
    ctx.translate(h.x, h.y);
    ctx.rotate(h.rot);
    ctx.globalAlpha = h.alpha;
    if (h.emoji) {
      ctx.font = Math.round(h.size) + "px serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(h.emoji, 0, 0);
    } else {
      heartPath(h.size);
      ctx.shadowColor = h.color;
      ctx.shadowBlur = 12;
      ctx.fillStyle = h.color;
      ctx.fill();
    }
    ctx.restore();
  }

  function init() {
    resize();
    hearts = [];
    var count = Math.round(Math.min(70, Math.max(28, W / 14)));
    for (var i = 0; i < count; i++) {
      var h = makeHeart(rand(0, W), rand(0, H));
      hearts.push(h);
    }
  }

  var t = 0;
  function frame() {
    t += 0.016;
    ctx.clearRect(0, 0, W, H);
    for (var i = hearts.length - 1; i >= 0; i--) {
      var h = hearts[i];
      if (h.burst) {
        h.x += h.vx;
        h.y += h.vy;
        h.vy += 0.06;
        h.vx *= 0.99;
        h.alpha -= 0.008;
        if (h.alpha <= 0) { hearts.splice(i, 1); continue; }
      } else {
        h.y -= h.speed;
        h.x += Math.sin(t * h.freq + h.phase) * 0.6;
        if (h.y < -h.size * 2) {
          hearts[i] = makeHeart(rand(0, W), H + h.size);
          continue;
        }
      }
      h.rot += h.rotSpeed;
      draw(h);
    }
    if (!reduce) requestAnimationFrame(frame);
  }

  function burstAt(x, y) {
    for (var i = 0; i < 14; i++) hearts.push(makeHeart(x, y, true));
    if (reduce) { frame(); }
  }

  window.addEventListener("pointerdown", function (e) { burstAt(e.clientX, e.clientY); });
  window.addEventListener("resize", function () { resize(); });

  init();
  if (reduce) { frame(); } else { requestAnimationFrame(frame); }
})();
</script>

</body></html>
